name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Web app typecheck, tests and build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Functions build and tests
        working-directory: functions
        run: |
          npm run build
          npm test
